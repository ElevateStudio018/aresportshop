let cur=FAV[0];
function code2(n){return 'D'+String(n).padStart(4,'0')}
function show(n){cur=n;const p=DES[n-1];document.getElementById('view').innerHTML=render(p);
 document.getElementById('info').innerHTML='<b>'+code2(n)+'</b>'+desc(p);
 document.querySelectorAll('#chips button').forEach(b=>b.setAttribute('aria-current',+b.dataset.n===n));
 const a=document.querySelector('#chips [aria-current=true]');if(a)a.scrollIntoView({inline:'center',block:'nearest'});
 history.replaceState(null,'','#'+code2(n));scrollTo(0,0)}
document.getElementById('chips').innerHTML=FAV.map(n=>`<button data-n="${n}">${code2(n)}</button>`).join('');
document.querySelectorAll('#chips button').forEach(b=>b.onclick=()=>show(+b.dataset.n));
const step=d=>{const i=FAV.indexOf(cur);if(i<0){show(Math.min(1000,Math.max(1,cur+d)));return}show(FAV[(i+d+FAV.length)%FAV.length])};
document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);
document.getElementById('nr').onchange=e=>{const n=parseInt(e.target.value.replace(/\D/g,''));if(n>=1&&n<=1000)show(n);e.target.value=''};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});
addEventListener('hashchange',()=>{const m=location.hash.match(/D?(\d{1,4})/);if(m&&+m[1]!==cur)show(+m[1])});
const h=location.hash.match(/D?(\d{1,4})/);show(h&&+h[1]>=1&&+h[1]<=1000?+h[1]:FAV[0]);
</script></body></html>
